<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flutter Web</title>
    <!-- Favicon (opcional) -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>
      // This script is injected by Flutter during the build process
      if (typeof window !== "undefined") {
        window.addEventListener("load", function () {
          const script = document.createElement("script");
          script.src = "flutter.js";
          script.onload = function () {
            window.flutterWebRenderer = "html"; // You can switch to "canvaskit" for more performance
          };
          document.body.appendChild(script);
        });
      }
    </script>
  </head>
  <body>
    <script>
      // Here, the Flutter web application will be injected during build
      window.addEventListener("load", function () {
        const script = document.createElement("script");
        script.src = "main.dart.js"; // This will be generated by Flutter build
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
